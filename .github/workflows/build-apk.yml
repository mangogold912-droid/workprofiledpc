name: Build APK

# push(기본 브랜치), PR, 수동 실행 시 APK를 빌드해 GitHub Release로 게시합니다.
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Release(릴리스) 생성/업로드 권한
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: |
          if [ -x ./gradlew ]; then ./gradlew assembleDebug --no-daemon
          else gradle assembleDebug --no-daemon; fi

      - name: Verify APK exists
        run: |
          ls -la app/build/outputs/apk/debug/*.apk

      - name: Compute version tag
        id: tag
        run: |
          echo "version=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "WorkProfile DPC ${{ steps.tag.outputs.version }}"
          draft: false
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
