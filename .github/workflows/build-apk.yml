name: Build APK

# push(기본 브랜치), PR, 수동 실행 시 Android APK를 빌드해 artifact로 올립니다.
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Validate Gradle wrapper (if present)
        run: chmod +x gradlew || true

      - name: Build debug APK
        run: |
          if [ -x ./gradlew ]; then ./gradlew assembleDebug --no-daemon
          else gradle assembleDebug --no-daemon; fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: workprofile-dpc-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
